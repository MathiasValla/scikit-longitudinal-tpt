name: scikit-longitudinal-tpt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # stopit imports pkg_resources at runtime, so CI needs setuptools explicitly
  - setuptools
  - jupyter
  - matplotlib
  - numpy
  - pandas
  - scipy
  - pip:
      # TpT depends on the upstream scikit-lexicographical-trees 0.0.5 release.
      - scikit-lexicographical-trees==0.0.5
      # Keep scikit-longitudinal pinned to the TpT paper implementation commit.
      - git+https://github.com/MathiasValla/scikit-longitudinal.git@a66979f6d9039ea1d7f9d02be69e29781c34fe46
