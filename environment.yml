name: scikit-longitudinal-tpt
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - git
  # stopit imports pkg_resources at runtime, so CI needs setuptools explicitly
  - setuptools<81
  - jupyter=1.1.1
  - matplotlib=3.10.8
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.16.3
  - cython=3.0
  - meson-python
  - ninja
  - c-compiler
  - cxx-compiler
