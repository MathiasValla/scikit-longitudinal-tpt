description: |
  A reproducible article presenting the Time-penalized Trees (TpT) splitter
  implemented in scikit-longitudinal, with one classification example on the
  primary biliary cirrhosis longitudinal dataset and one regression example on
  the Produc US state production panel.
abstract: >+
  We present the Time-penalized Trees (TpT) splitter as implemented in
  scikit-longitudinal, a Python package for longitudinal machine learning. TpT
  extends recursive partitioning to repeated-measures covariates by penalizing
  candidate splits that rely on later observation waves. We describe the
  underlying split criterion, summarize the main user-facing parameters, and
  illustrate the implementation on two public longitudinal datasets: a
  subject-level classification problem based on the primary biliary cirrhosis
  follow-up data and a state-level regression problem based on the Produc
  panel. These examples show how the time penalty affects the selected split
  times and how the exported trees reveal both which predictors matter and when
  they matter.
keywords: [longitudinal data, decision trees, reproducibility, Python, software]
